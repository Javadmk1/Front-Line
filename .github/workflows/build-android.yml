name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    name: Export Godot project to Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Godot Android export environment
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
          cp -a /root/.config/godot "$HOME/.config/"
          test -f "$HOME/.config/godot/editor_settings-4.3.tres"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          sed -i "s|^export/android/android_sdk_path = .*|export/android/android_sdk_path = \"/usr/lib/android-sdk\"|" "$SETTINGS"
          sed -i "s|^export/android/java_sdk_path = .*|export/android/java_sdk_path = \"$JAVA_HOME\"|" "$SETTINGS"
          echo "Android SDK and Java paths configured."
          grep -E 'export/android/.*(sdk_path)' "$SETTINGS" || true
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "Checking Android SDK packages"
          find /usr/lib/android-sdk -maxdepth 3 -type d | head -80
          SDKMANAGER="/usr/lib/android-sdk/cmdline-tools/cmdline-tools/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            "$SDKMANAGER" --sdk_root=/usr/lib/android-sdk "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          fi
          godot --version

      - name: Import and validate project
        run: godot --headless --path . --editor --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/FrontLine-Android-Debug.apk --verbose
          test -s build/FrontLine-Android-Debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrontLine-Android-Debug
          path: build/FrontLine-Android-Debug.apk
          if-no-files-found: error
          retention-days: 14
