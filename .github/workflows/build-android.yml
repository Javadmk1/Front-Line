name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    name: Export Godot project to Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Godot Android export environment
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
          cp -a /root/.config/godot "$HOME/.config/"
          mkdir -p "$HOME/.android"
          if [ -f /root/.android/debug.keystore ]; then cp /root/.android/debug.keystore "$HOME/.android/debug.keystore"; fi
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -f "$HOME/.config/godot/editor_settings-4.3.tres"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          sed -i "s|^export/android/android_sdk_path = .*|export/android/android_sdk_path = \"/usr/lib/android-sdk\"|" "$SETTINGS"
          sed -i "s|^export/android/java_sdk_path = .*|export/android/java_sdk_path = \"$JAVA_HOME\"|" "$SETTINGS"
          sed -i "s|^export/android/debug_keystore = .*|export/android/debug_keystore = \"$HOME/.android/debug.keystore\"|" "$SETTINGS"
          sed -i "s|^export/android/debug_keystore_user = .*|export/android/debug_keystore_user = \"androiddebugkey\"|" "$SETTINGS"
          PRESET="export_presets.cfg"
          test -f "$PRESET"
          if grep -q '^keystore/debug=' "$PRESET"; then
            sed -i "s|^keystore/debug=.*|keystore/debug=\"$HOME/.android/debug.keystore\"|" "$PRESET"
          else
            sed -i '/^\[preset\.0\.options\]/a keystore/debug=\"'$HOME'/.android/debug.keystore\"' "$PRESET"
          fi
          if grep -q '^keystore/debug_user=' "$PRESET"; then
            sed -i 's|^keystore/debug_user=.*|keystore/debug_user="androiddebugkey"|' "$PRESET"
          else
            sed -i '/^\[preset\.0\.options\]/a keystore/debug_user="androiddebugkey"' "$PRESET"
          fi
          if grep -q '^keystore/debug_password=' "$PRESET"; then
            sed -i 's|^keystore/debug_password=.*|keystore/debug_password="android"|' "$PRESET"
          else
            sed -i '/^\[preset\.0\.options\]/a keystore/debug_password="android"' "$PRESET"
          fi
          echo "Android SDK, Java, and debug keystore paths configured."
          echo "--- Android export settings ---"
          grep -E '^export/android/' "$SETTINGS" || true
          echo "--- Android template files ---"
          find "$HOME/.local/share/godot/export_templates/4.3.stable" -maxdepth 1 -type f -printf "%f %s bytes\\n" | sort
          echo "--- SDK build tools ---"
          for tool in aapt apksigner zipalign; do find /usr/lib/android-sdk/build-tools -type f -name "$tool" -print 2>/dev/null || true; done
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "Checking Android SDK packages"
          find /usr/lib/android-sdk -maxdepth 3 -type d | head -80
          echo "Locating Android SDK manager..."
          SDKMANAGER="$(find /usr/lib/android-sdk /opt /root -type f -path '*/cmdline-tools/*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found in the build image."
            find /usr/lib/android-sdk /opt /root -maxdepth 5 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          SDK_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")")"
          echo "SDKMANAGER=$SDKMANAGER"
          echo "SDK_ROOT=$SDK_ROOT"
          mkdir -p "$SDK_ROOT"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          sed -i "s|^export/android/android_sdk_path = .*|export/android/android_sdk_path = \"$SDK_ROOT\"|" "$SETTINGS"
          echo "--- Confirm required SDK packages ---"
          test -d "$SDK_ROOT/platform-tools"
          test -d "$SDK_ROOT/platforms/android-34"
          test -d "$SDK_ROOT/build-tools/34.0.0"
          test -d "$SDK_ROOT/ndk/23.2.8568313"
          test -d "$SDK_ROOT/cmake/3.10.2.4988404"
          godot --version

      - name: Import and validate project
        run: godot --headless --path . --editor --quit

      - name: Export debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/FrontLine-Android-Debug.apk --verbose 2>&1 | tee build/export.log
          test -s build/FrontLine-Android-Debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrontLine-Android-Debug
          path: build/FrontLine-Android-Debug.apk
          if-no-files-found: error
          retention-days: 14
