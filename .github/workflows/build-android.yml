name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    name: Export Godot project to Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Godot Android export environment
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
          cp -a /root/.config/godot "$HOME/.config/"
          mkdir -p "$HOME/.android"
          if [ -f /root/.android/debug.keystore ]; then cp /root/.android/debug.keystore "$HOME/.android/debug.keystore"; fi
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -f "$HOME/.config/godot/editor_settings-4.3.tres"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          sed -i "s|^export/android/android_sdk_path = .*|export/android/android_sdk_path = \"/usr/lib/android-sdk\"|" "$SETTINGS"
          sed -i "s|^export/android/java_sdk_path = .*|export/android/java_sdk_path = \"$JAVA_HOME\"|" "$SETTINGS"
          sed -i "s|^export/android/debug_keystore = .*|export/android/debug_keystore = \"$HOME/.android/debug.keystore\"|" "$SETTINGS"
          sed -i "s|^export/android/debug_keystore_user = .*|export/android/debug_keystore_user = \"androiddebugkey\"|" "$SETTINGS"
          echo "Android SDK, Java, and debug keystore paths configured."
          echo "--- Android export settings ---"
          grep -E '^export/android/' "$SETTINGS" || true
          echo "--- Android template files ---"
          find "$HOME/.local/share/godot/export_templates/4.3.stable" -maxdepth 1 -type f -printf "%f %s bytes\\n" | sort
          echo "--- SDK build tools ---"
          find /usr/lib/android-sdk/build-tools -maxdepth 2 -type f \\( -name aapt -o -name apksigner -o -name zipalign \\) -print 2>/dev/null || true
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "Checking Android SDK packages"
          find /usr/lib/android-sdk -maxdepth 3 -type d | head -80
          SDKMANAGER="/usr/lib/android-sdk/cmdline-tools/cmdline-tools/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            "$SDKMANAGER" --sdk_root=/usr/lib/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi
          godot --version

      - name: Import and validate project
        run: godot --headless --path . --editor --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/FrontLine-Android-Debug.apk --verbose
          test -s build/FrontLine-Android-Debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrontLine-Android-Debug
          path: build/FrontLine-Android-Debug.apk
          if-no-files-found: error
          retention-days: 14
