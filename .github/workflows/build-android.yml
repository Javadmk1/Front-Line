name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    name: Export Godot project to Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Godot Android export environment
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
          cp -a /root/.config/godot "$HOME/.config/"
          test -f "$HOME/.config/godot/editor_settings-4.3.tres"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          godot --version

      - name: Import and validate project
        run: godot --headless --path . --editor --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/FrontLine-Android-Debug.apk
          test -s build/FrontLine-Android-Debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrontLine-Android-Debug
          path: build/FrontLine-Android-Debug.apk
          if-no-files-found: error
          retention-days: 14
